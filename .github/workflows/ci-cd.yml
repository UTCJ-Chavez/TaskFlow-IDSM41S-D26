name: CI-CD TaskFlow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de prueba
        run: pip install -r requirements-dev.txt

      - name: Verificar sintaxis (build)
        run: python -m compileall -q .

      - name: Ejecutar pruebas con cobertura
        run: >
          python -m pytest --cov --cov-report=term-missing
          --cov-report=xml --cov-fail-under=80
          --junitxml=resultados.xml

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: |
            resultados.xml
            coverage.xml

  release:
    name: Publicar release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar la version
        run: git archive --format=zip --prefix=taskflow/ -o "taskflow-${{ github.ref_name }}.zip" HEAD

      - name: Crear release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "taskflow-${{ github.ref_name }}.zip"
          --title "TaskFlow ${{ github.ref_name }}"
          --generate-notes
